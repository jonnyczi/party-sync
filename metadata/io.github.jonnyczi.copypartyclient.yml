# F-Droid metadata recipe — submit a copy to the fdroiddata repo as a merge
# request. F-Droid builds from source on its own buildserver, then (via the
# Binaries: field below) compares that build against the APK we publish on
# GitHub and ships OUR signed binary instead of re-signing with its own key, so
# an F-Droid install stays cross-updatable with the GitHub one. That requires
# bit-for-bit reproducibility — see roadmap §2a, which is NOT proven yet.
#
# PREREQUISITE (blocking): github.com/jonnyczi/party-sync is currently PRIVATE.
# F-Droid clones anonymously, so the repo must be made public before this recipe
# can build. The v0.11.0 tag it pins already exists there.
#
# Expo/React Native on F-Droid's Debian buildserver is fiddly — validate locally
# with `fdroid build io.github.jonnyczi.copypartyclient` (fdroidserver) and
# expect to iterate before the MR passes F-Droid CI. Known rough edges:
#   - No `ndk:` pin below, so F-Droid picks its own; flake.nix builds against
#     27.1.12297006. Pin it here if the buildserver's default fails.
#   - `npm ci` installs devDependencies, including better-sqlite3's prebuilt
#     .node binary — exactly what F-Droid's scanner flags. Try `--omit=dev`
#     if `expo prebuild` still succeeds without them.
#   - The nodesource `curl | bash` below may draw reviewer objection; Debian's
#     own Node is too old for Expo SDK 54, so it needs a defensible answer.

Categories:
  - Internet
# The launcher label is just "Party Sync"; the listing name carries "copyparty"
# so users searching F-Droid for their server software actually find the client.
Name: Party Sync — copyparty backup
Summary: Back up your phone to your own copyparty server
License: MIT
AuthorName: jonnyczi
SourceCode: https://github.com/jonnyczi/party-sync
IssueTracker: https://github.com/jonnyczi/party-sync/issues

RepoType: git
Repo: https://github.com/jonnyczi/party-sync.git

Builds:
  - versionName: 0.11.0
    versionCode: 13
    commit: v0.11.0
    # android/ is gitignored and generated by `expo prebuild`, so install a
    # current Node (Debian's is too old for Expo SDK 54) and prebuild here.
    sudo:
      - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
      - apt-get install -y nodejs
    prebuild:
      - npm ci
      - npx expo prebuild --platform android --no-install
      # Ship ARM only (matches the GitHub/Play artifacts): override the four-ABI
      # default expo prebuild writes. x86/x86_64 are emulator-only; dropping them
      # halves the native build and shrinks the APK.
      - sed -i 's/^reactNativeArchitectures=.*/reactNativeArchitectures=armeabi-v7a,arm64-v8a/' android/gradle.properties
    subdir: android/app
    gradle:
      - yes
    # No signing block: our release signingConfig (plugins/withReleaseSigning.js)
    # falls back to debug signing when COPYPARTY_UPLOAD_* are unset. F-Droid
    # discards whatever signature this build produces — it only compares the
    # unsigned contents against the published binary below.

# Publish OUR signed APK rather than an F-Droid-signed one, so GitHub and
# F-Droid installs are cross-updatable. F-Droid downloads this URL, verifies it
# reproduces from the build above, and republishes it unchanged.
# %v expands to versionName, matching our release asset naming.
Binaries: https://github.com/jonnyczi/party-sync/releases/download/v%v/party-sync-v%v.apk

# Pins the signer F-Droid will accept: the cert verified on v0.11.0,
# CN=jonnyczi, O=copyparty-client. Its keystore password is unrecoverable, so
# this can never be rotated — see roadmap §4.
AllowedAPKSigningKeys: f687d5f0de1f584476a604663609c9b4df45bae74c9c846e15082740092eb77f

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 0.11.0
CurrentVersionCode: 13
