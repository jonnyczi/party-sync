plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.copypartysha512'
version = '0.7.10'

android {
  namespace "expo.modules.copypartysha512"
  defaultConfig {
    versionCode 1
    versionName "0.7.10"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // androidx.documentfile was dropped along with DocumentFile-based walkTree:
  // its per-getter ContentResolver.query behaviour was the SAF scan bottleneck.
  // SafTreeWalker talks to DocumentsContract (framework) directly.
}
